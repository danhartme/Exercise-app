<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Grammar Engine</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --bg: #F9FAFB;
      --card-bg: #FFFFFF;
      --text-main: #111827;
      --text-muted: #6B7280;
      --primary: #3B82F6;
      --primary-hover: #2563EB;
      --success: #10B981;
      --error: #EF4444;
      --border: #E5E7EB;
      --mono: 'DM Mono', monospace;
      --sans: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--sans);
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 1rem;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    #app-container {
      width: 100%;
      max-width: 500px;
      margin-top: 2rem;
    }

    .progress-bar {
      height: 6px;
      background: var(--border);
      border-radius: 4px;
      margin-bottom: 2rem;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 2rem 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      border: 1px solid var(--border);
    }

    .instruction {
      font-size: 0.875rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    /* 1. Fill In Styles */
    .fill-in-container {
      font-size: 1.125rem;
      line-height: 1.8;
    }
    .fill-in-input {
      font-family: var(--mono);
      font-size: 1rem;
      color: var(--primary);
      border: none;
      border-bottom: 2px solid var(--border);
      background: #F3F4F6;
      padding: 0.25rem 0.5rem;
      margin: 0 0.25rem;
      border-radius: 4px 4px 0 0;
      width: 140px;
      text-align: center;
      transition: all 0.2s;
      outline: none;
    }
    .fill-in-input:focus {
      border-bottom-color: var(--primary);
      background: #EFF6FF;
    }
    .fill-in-input.correct { border-bottom-color: var(--success); color: var(--success); background: #ECFDF5; }
    .fill-in-input.incorrect { border-bottom-color: var(--error); color: var(--error); background: #FEF2F2; }

    /* 2. Multiple Choice Styles */
    .mc-container {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .mc-option {
      padding: 1rem;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: transparent;
      font-family: var(--sans);
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-main);
    }
    .mc-option:active { transform: scale(0.98); }
    .mc-option.selected { border-color: var(--primary); background: #EFF6FF; }
    .mc-option.correct { border-color: var(--success); background: #ECFDF5; color: #065F46; }
    .mc-option.incorrect { border-color: var(--error); background: #FEF2F2; color: #991B1B; }

    /* 3. Word Order Styles */
    .word-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      min-height: 50px;
      margin-bottom: 1.5rem;
      padding: 1rem;
      background: #F9FAFB;
      border-radius: 12px;
      border: 1px dashed var(--border);
    }
    .word-pill {
      padding: 0.5rem 1rem;
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: transform 0.1s;
    }
    .word-pill:active { transform: scale(0.95); }
    .word-built {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      min-height: 60px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .word-built .word-pill { background: var(--primary); color: white; border-color: var(--primary); }

    /* Controls & Feedback */
    .btn {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 12px;
      font-family: var(--sans);
      font-size: 1rem;
      font-weight: 600;
      color: white;
      background: var(--primary);
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 2rem;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn:active:not(:disabled) { transform: scale(0.98); }

    .feedback {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      display: none;
      animation: slideDown 0.3s ease forwards;
    }
    .feedback.success { display: block; background: #ECFDF5; border: 1px solid #A7F3D0; color: #065F46; }
    .feedback.error { display: block; background: #FEF2F2; border: 1px solid #FECACA; color: #991B1B; }
    
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    .shake { animation: shake 0.3s; }
  </style>
</head>
<body>

  <!-- THE DATA NODE -->
  <script type="application/json" id="exercise-data">
    [
      {
        "type": "fill_in",
        "instruction": "Present Continuous (Ongoing Action)",
        "text_before": "We",
        "text_after": "the Midjourney API into our design system this week.",
        "hint_verb": "integrate",
        "accepted_answers": ["are integrating", "re integrating", "'re integrating"],
        "explanation": "Use the Present Continuous for an action happening around the time of speaking/this week."
      },
      {
        "type": "multiple_choice",
        "instruction": "Past Simple vs. Present Perfect",
        "text_before": "I",
        "text_after": "the report to the client yesterday.",
        "options": ["have sent", "sent", "was sending"],
        "correct_answer": "sent",
        "explanation": "Use the Past Simple ('sent') because the time marker 'yesterday' indicates a finished time period in the past."
      },
      {
        "type": "word_order",
        "instruction": "Present Perfect Continuous Question",
        "words": ["long", "working", "have", "you", "been", "how", "here?"],
        "correct_order": ["how", "long", "have", "you", "been", "working", "here?"],
        "explanation": "Question structure: Wh-word (How long) + auxiliary (have) + subject (you) + been + verb-ing (working)."
      }
    ]
  </script>

  <div id="app-container">
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    
    <div class="card">
      <div class="instruction" id="instruction">Loading...</div>
      <div id="exercise-canvas"></div>
      
      <div id="feedback" class="feedback"></div>
      <button id="action-btn" class="btn">Check Answer</button>
    </div>
  </div>

  <script>
    class GrammarEngine {
      constructor() {
        this.data = JSON.parse(document.getElementById('exercise-data').textContent);
        this.currentIndex = 0;
        
        // DOM Elements
        this.canvas = document.getElementById('exercise-canvas');
        this.instruction = document.getElementById('instruction');
        this.actionBtn = document.getElementById('action-btn');
        this.feedback = document.getElementById('feedback');
        this.progressBar = document.getElementById('progress');
        
        // State
        this.state = {};
        this.isAnswered = false;
        
        this.actionBtn.addEventListener('click', () => this.handleAction());
        this.renderExercise();
      }

      renderExercise() {
        this.isAnswered = false;
        this.state = {};
        this.feedback.className = 'feedback';
        this.feedback.innerHTML = '';
        this.actionBtn.textContent = 'Check Answer';
        
        const ex = this.data[this.currentIndex];
        this.instruction.textContent = ex.instruction;
        this.progressBar.style.width = `${(this.currentIndex / this.data.length) * 100}%`;

        this.canvas.innerHTML = '';

        if (ex.type === 'fill_in') this.renderFillIn(ex);
        if (ex.type === 'multiple_choice') this.renderMultipleChoice(ex);
        if (ex.type === 'word_order') this.renderWordOrder(ex);
      }

      // --- RENDERERS ---

      renderFillIn(ex) {
        const container = document.createElement('div');
        container.className = 'fill-in-container';
        
        container.innerHTML = `
          <span>${ex.text_before}</span>
          <input type="text" id="fill-input" class="fill-in-input" placeholder="(${ex.hint_verb})" autocomplete="off" autocorrect="off" autocapitalize="none">
          <span>${ex.text_after}</span>
        `;
        this.canvas.appendChild(container);
        
        const input = document.getElementById('fill-input');
        // Auto-resize input loosely based on content
        input.addEventListener('input', (e) => {
          e.target.style.width = Math.max(140, e.target.value.length * 12) + 'px';
        });
      }

      renderMultipleChoice(ex) {
        const container = document.createElement('div');
        container.className = 'fill-in-container';
        container.innerHTML = `<span>${ex.text_before}</span> <strong>_______</strong> <span>${ex.text_after}</span>`;
        
        const optionsContainer = document.createElement('div');
        optionsContainer.className = 'mc-container';

        ex.options.forEach((opt) => {
          const btn = document.createElement('button');
          btn.className = 'mc-option';
          btn.textContent = opt;
          btn.onclick = () => {
            if (this.isAnswered) return;
            document.querySelectorAll('.mc-option').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            this.state.selectedOption = opt;
          };
          optionsContainer.appendChild(btn);
        });

        this.canvas.appendChild(container);
        this.canvas.appendChild(optionsContainer);
      }

      renderWordOrder(ex) {
        this.state.availableWords = [...ex.words].sort(() => Math.random() - 0.5);
        this.state.builtWords = [];

        const builtArea = document.createElement('div');
        builtArea.className = 'word-built';
        builtArea.id = 'built-area';

        const poolArea = document.createElement('div');
        poolArea.className = 'word-pool';
        poolArea.id = 'pool-area';

        this.canvas.appendChild(builtArea);
        this.canvas.appendChild(poolArea);

        this.updateWordOrderUI();
      }

      updateWordOrderUI() {
        const builtArea = document.getElementById('built-area');
        const poolArea = document.getElementById('pool-area');
        builtArea.innerHTML = '';
        poolArea.innerHTML = '';

        this.state.builtWords.forEach((word, index) => {
          const pill = document.createElement('div');
          pill.className = 'word-pill';
          pill.textContent = word;
          pill.onclick = () => {
            if (this.isAnswered) return;
            this.state.builtWords.splice(index, 1);
            this.state.availableWords.push(word);
            this.updateWordOrderUI();
          };
          builtArea.appendChild(pill);
        });

        this.state.availableWords.forEach((word, index) => {
          const pill = document.createElement('div');
          pill.className = 'word-pill';
          pill.textContent = word;
          pill.onclick = () => {
            if (this.isAnswered) return;
            this.state.availableWords.splice(index, 1);
            this.state.builtWords.push(word);
            this.updateWordOrderUI();
          };
          poolArea.appendChild(pill);
        });
      }

      // --- LOGIC EVALUATION ---

      handleAction() {
        if (this.isAnswered) {
          // Move to next
          this.currentIndex++;
          if (this.currentIndex >= this.data.length) {
            this.canvas.innerHTML = '<div style="text-align:center; padding:2rem;"><h3>🎉 All done!</h3><p>You completed the exercise.</p></div>';
            this.instruction.style.display = 'none';
            this.actionBtn.style.display = 'none';
            this.feedback.style.display = 'none';
            this.progressBar.style.width = '100%';
            return;
          }
          this.renderExercise();
          return;
        }

        const ex = this.data[this.currentIndex];
        let isCorrect = false;

        if (ex.type === 'fill_in') {
          const input = document.getElementById('fill-input');
          const val = input.value.trim().toLowerCase();
          if (!val) return this.triggerShake();
          
          isCorrect = ex.accepted_answers.map(a => a.toLowerCase()).includes(val);
          input.classList.add(isCorrect ? 'correct' : 'incorrect');
          input.disabled = true;
        } 
        
        else if (ex.type === 'multiple_choice') {
          if (!this.state.selectedOption) return this.triggerShake();
          
          isCorrect = this.state.selectedOption === ex.correct_answer;
          const options = document.querySelectorAll('.mc-option');
          options.forEach(btn => {
            if (btn.textContent === ex.correct_answer) btn.classList.add('correct');
            else if (btn.classList.contains('selected') && !isCorrect) btn.classList.add('incorrect');
            btn.style.pointerEvents = 'none';
          });
        } 
        
        else if (ex.type === 'word_order') {
          if (this.state.availableWords.length > 0) return this.triggerShake();
          
          isCorrect = this.state.builtWords.join(' ') === ex.correct_order.join(' ');
          const builtArea = document.getElementById('built-area');
          if (!isCorrect) builtArea.classList.add('shake');
        }

        this.showFeedback(isCorrect, ex.explanation);
      }

      triggerShake() {
        this.canvas.classList.remove('shake');
        void this.canvas.offsetWidth; // trigger reflow
        this.canvas.classList.add('shake');
      }

      showFeedback(isCorrect, explanation) {
        this.isAnswered = true;
        this.feedback.className = `feedback ${isCorrect ? 'success' : 'error'}`;
        
        if (isCorrect) {
          this.feedback.innerHTML = `<strong>Correct!</strong><br>${explanation}`;
          this.actionBtn.textContent = 'Next Exercise';
        } else {
          this.feedback.innerHTML = `<strong>Not quite.</strong><br>${explanation}`;
          this.actionBtn.textContent = 'Got it, Next';
        }
      }
    }

    // Initialize Engine
    document.addEventListener('DOMContentLoaded', () => {
      new GrammarEngine();
    });
  </script>
</body>
</html>
