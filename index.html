<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrammarStudio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            --bg: #0d0d0d;
            --surface: #1a1a1a;
            --surface-hover: #262626;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #6366f1; /* Indigo */
            --success: #10b981;
            --error: #ef4444;
            --border: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 4rem;
        }

        .container { max-width: 600px; margin: 0 auto; padding: 0 1rem; }

        header {
            padding: 1.5rem 0;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
        
        .score {
            font-family: 'JetBrains Mono', monospace;
            background: var(--surface);
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            font-size: 0.875rem;
            border: 1px solid var(--border);
        }

        /* Navigation */
        .nav-scroll {
            display: flex;
            overflow-x: auto;
            gap: 0.5rem;
            padding-bottom: 1rem;
            scrollbar-width: none;
        }
        .nav-scroll::-webkit-scrollbar { display: none; }

        .unit-tab {
            background: var(--surface);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 500;
            transition: all 0.2s;
        }

        .unit-tab.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Content Area */
        .unit-header { margin: 1.5rem 0; }
        .unit-header h2 { font-size: 1.5rem; margin-bottom: 0.25rem; }
        .unit-header p { color: var(--text-muted); font-size: 0.95rem; }

        .exercise-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1rem;
        }

        .ex-title {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .question { margin-bottom: 1.25rem; font-size: 1rem; }
        
        input[type="text"] {
            font-family: 'JetBrains Mono', monospace;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--text-muted);
            color: var(--accent);
            font-size: 1rem;
            padding: 0.1rem 0.25rem;
            width: 140px;
            text-align: center;
            outline: none;
        }

        input[type="text"]:focus { border-bottom-color: var(--accent); }
        input[type="text"]:disabled { color: var(--text-main); border-bottom-style: dashed; }

        .btn {
            display: block;
            width: 100%;
            background: var(--text-main);
            color: var(--bg);
            border: none;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
        }
        .btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

        .feedback { display: block; font-size: 0.875rem; margin-top: 0.5rem; min-height: 20px; }
        .feedback.success { color: var(--success); }
        .feedback.error { color: var(--error); }
        .hint { display: block; color: var(--text-muted); margin-top: 0.25rem; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>GrammarStudio</h1>
        <div class="score" id="scoreDisplay">Score: 0/0</div>
    </header>

    <div class="nav-scroll" id="navContainer">
        </div>

    <main id="appContent">
        </main>
</div>

<script>
    // ==========================================
    // 🧠 THE DATABASE (Add as many as you want here)
    // ==========================================
    const courseData = [
        {
            id: 1,
            title: "Unit 1",
            subtitle: "Present Simple vs Continuous",
            exercises: [
                {
                    title: "1.1 The Remote Work Setup",
                    type: "fill",
                    questions: [
                        { text: "Normally, I [work] from home on Fridays.", answer: "work", hint: "Routine = Present Simple" },
                        { text: "But today, I [am working] from a cafe because the wifi is down.", answer: "am working|'m working", hint: "Temporary action = Present Continuous" },
                        { text: "The client [wants] the prototype by tomorrow morning.", answer: "wants", hint: "State verbs (want) are never continuous." },
                        { text: "We [are reviewing] the brand guidelines right now on the call.", answer: "are reviewing|'re reviewing", hint: "Happening exactly right now." }
                    ]
                },
                {
                    title: "1.2 Feedback Loop",
                    type: "fill",
                    questions: [
                        { text: "She always [leaves] great comments in the Figma file.", answer: "leaves", hint: "Habitual action" },
                        { text: "Why [are you changing] the layout? We already approved it.", answer: "are you changing", hint: "Action happening at this moment" },
                        { text: "I [do not understand] why they want a darker color palette.", answer: "do not understand|don't understand", hint: "State verb 'understand'" },
                        { text: "The team [is trying] to finish the presentation before the meeting.", answer: "is trying|'re trying", hint: "Current ongoing effort" }
                    ]
                }
            ]
        },
        {
            id: 2,
            title: "Unit 2",
            subtitle: "Past Simple vs Present Perfect",
            exercises: [
                {
                    title: "2.1 Project Status Check",
                    type: "fill",
                    questions: [
                        { text: "I [have finished] the coaching plan for the junior designer.", answer: "have finished|'ve finished", hint: "Action is complete, but time is not specified (focus is on the result)." },
                        { text: "I [spoke] to him about it yesterday afternoon.", answer: "spoke", hint: "Finished time (yesterday) = Past Simple." },
                        { text: "We [have not received] the copy from the marketing team yet.", answer: "have not received|haven't received", hint: "Up to the present moment (yet)." },
                        { text: "They [launched] the new retail locations last month.", answer: "launched", hint: "Finished time (last month)." }
                    ]
                },
                {
                    title: "2.2 Client Escalation",
                    type: "fill",
                    questions: [
                        { text: "[Have you seen] the latest email from the CEO?", answer: "have you seen", hint: "Checking recent experience." },
                        { text: "Yes, she [sent] it ten minutes ago.", answer: "sent", hint: "Specific past time (ten minutes ago)." },
                        { text: "The script [has crashed] three times this morning.", answer: "has crashed", hint: "Morning is not over yet." }
                    ]
                }
            ]
        },
        // ADD UNIT 3, 4, 5... HERE USING THE EXACT SAME FORMAT
        {
            id: 3,
            title: "Unit 3",
            subtitle: "Placeholders",
            exercises: [
                { title: "3.1 Empty for now", type: "fill", questions: [{ text: "Type [yes] here.", answer: "yes", hint: "" }] }
            ]
        }
    ];

    // ==========================================
    // ⚙️ THE APP ENGINE (Do not edit below)
    // ==========================================
    let currentUnit = 1;
    let totalQuestions = 0;
    let correctAnswers = 0;

    function init() {
        const nav = document.getElementById('navContainer');
        courseData.forEach(unit => {
            const btn = document.createElement('button');
            btn.className = `unit-tab ${unit.id === currentUnit ? 'active' : ''}`;
            btn.textContent = unit.title;
            btn.onclick = () => renderUnit(unit.id);
            nav.appendChild(btn);
        });
        renderUnit(currentUnit);
    }

    function renderUnit(unitId) {
        currentUnit = unitId;
        document.querySelectorAll('.unit-tab').forEach((btn, idx) => {
            btn.className = `unit-tab ${courseData[idx].id === currentUnit ? 'active' : ''}`;
        });

        const unitData = courseData.find(u => u.id === unitId);
        let html = `<div class="unit-header"><h2>${unitData.title}</h2><p>${unitData.subtitle}</p></div>`;

        unitData.exercises.forEach((ex, exIdx) => {
            html += `<div class="exercise-card" id="ex-${exIdx}">
                        <div class="ex-title">${ex.title}</div>`;
            
            ex.questions.forEach((q, qIdx) => {
                totalQuestions++;
                let textParts = q.text.split(/\[.*?\]/);
                let inputHtml = `<input type="text" data-ans="${q.answer}" placeholder="type here">`;
                html += `<div class="question">
                            ${textParts[0]}${inputHtml}${textParts[1]}
                            <div class="feedback" id="fb-${exIdx}-${qIdx}"></div>
                            ${q.hint ? `<span class="hint">💡 ${q.hint}</span>` : ''}
                         </div>`;
            });
            html += `<button class="btn" onclick="checkGroup(${exIdx})">Check Answers</button></div>`;
        });

        document.getElementById('appContent').innerHTML = html;
        updateScore();
    }

    function checkGroup(exIdx) {
        const card = document.getElementById(`ex-${exIdx}`);
        const inputs = card.querySelectorAll('input');
        let allFilled = true;

        inputs.forEach((input, qIdx) => {
            if(input.disabled) return;
            let val = input.value.toLowerCase().trim();
            let answers = input.dataset.ans.split('|').map(a => a.toLowerCase().trim());
            let fb = document.getElementById(`fb-${exIdx}-${qIdx}`);

            if(!val) { allFilled = false; fb.className="feedback error"; fb.textContent="Please fill this in."; return; }

            if(answers.includes(val)) {
                input.disabled = true;
                fb.className = "feedback success";
                fb.textContent = "✓ Correct";
                correctAnswers++;
            } else {
                fb.className = "feedback error";
                fb.innerHTML = `✗ Expected: <b>${answers[0]}</b>`;
                input.disabled = true;
            }
        });

        if(allFilled) {
            card.querySelector('.btn').disabled = true;
            card.querySelector('.btn').textContent = "Completed";
        }
        updateScore();
    }

    function updateScore() {
        document.getElementById('scoreDisplay').textContent = `Score: ${correctAnswers}/${totalQuestions}`;
    }

    init();
</script>
</body>
</html>
